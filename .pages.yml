# Pages CMS config — https://pagescms.org
#
# Setup: go to https://app.pagescms.org, sign in with GitHub, and grant the
# Pages CMS GitHub App access to this repo. That's it — no server or OAuth proxy
# to run. The architect edits content in the browser; saving commits to `master`,
# which triggers the GitHub Pages deploy.
#
# The site is bilingual (Czech + English). A field that differs per language is
# an object with required `cs` and `en` subfields. Pages CMS checks an optional
# object only once either subfield is filled, so it saves both languages or
# neither. Language-neutral fields (images, dates, email, phone) are single. See
# FEATURES.md "Dual language (Czech + English)".
#
# Pages CMS saves a top-level field named `body` as the Markdown below the
# frontmatter, so no top-level field takes that name.

media:
  input: public/uploads # uploaded files are committed here
  output: /uploads # ...and referenced by this path (served from site root)

content:
  - name: projects
    label: Projekty
    type: collection
    path: src/content/projects
    filename:
      template: '{primary}.md'
      field: true
    view:
      primary: title.en
      fields: [title.en, from, to, location.en]
    # A list column is headed by its subfield's label, so the pairs in `view`
    # name their field in it.
    fields:
      - name: title
        label: Název
        type: object
        required: true
        fields:
          # `|^$` takes the empty value, which `required` reports on its own.
          - { name: cs, label: Název (česky), type: string, required: true, pattern: &text { regex: '\S|^$', message: 'Zadejte text, ne jen mezery.' } }
          - { name: en, label: Název (anglicky), type: string, required: true, pattern: *text }
      - { name: thumbnail, label: Náhled projektu, type: image, required: false, description: 'Obrázek pro karty projektu a náhledy sdílených odkazů. Když pole necháte prázdné, automaticky se použije první obrázek v obsahu stránky. Výběr nemění obsah ani pořadí obrázků na stránce.' }
      - name: from
        label: Moje zapojení od
        type: string
        required: true
        pattern: &date { regex: '^((0?[1-9]|1[0-2])/)?[0-9]{4}$|^$', message: 'Zadejte rok, např. 2023, nebo měsíc a rok, např. 3/2023.' }
        description: 'Začátek mé práce na projektu: rok, např. 2023, nebo měsíc a rok, např. 3/2023.'
      - { name: to, label: Moje zapojení do, type: string, required: false, pattern: *date, description: 'Konec mé práce na projektu; u jednoho roku stejný rok jako začátek. Pokud moje zapojení trvá, nechte prázdné. Nejde o datum dokončení stavby.' }
      - name: location
        label: Místo
        type: object
        required: false
        description: &translations 'Nepovinné: vyplňte oba jazyky, nebo nechte obě pole prázdná.'
        fields:
          - { name: cs, label: Místo (česky), type: string, required: true, pattern: *text }
          - { name: en, label: Místo (anglicky), type: string, required: true, pattern: *text }
      - name: brief
        label: Brief
        type: object
        required: false
        description: 'Stručné představení projektu a mého zapojení do něj. Podrobnější popis patří do obsahu stránky. Nepovinné: vyplňte oba jazyky, nebo nechte obě pole prázdná.'
        fields: &text-pair
          - { name: cs, label: Česky, type: text, required: true, pattern: *text }
          - { name: en, label: Anglicky, type: text, required: true, pattern: *text }
      - name: context
        label: Kontext projektu
        description: 'Původ celého projektu. Lze kombinovat, např. školní soutěž. Zakázkový projekt může být zakázkou ateliéru, nemusí jít o mého přímého klienta.'
        type: select
        required: false
        options:
          multiple: true
          values:
            - { name: academic, label: Školní projekt }
            - { name: competition, label: Soutěžní návrh }
            - { name: commissioned, label: Zakázkový projekt }
            - { name: self_initiated, label: Vlastní iniciativa }
      - name: intervention
        label: Zásah
        type: select
        required: false
        options:
          multiple: true
          values:
            - { name: new_build, label: Novostavba }
            - { name: renovation, label: Rekonstrukce }
            - { name: extension, label: Přístavba }
            - { name: adaptive_reuse, label: Změna využití }
      - name: scope
        label: Zaměření projektu
        type: select
        required: false
        options:
          multiple: true
          values:
            - { name: architecture, label: Architektura }
            - { name: interior, label: Interiér }
            - { name: landscape, label: Krajinářská architektura }
            - { name: public_space, label: Veřejný prostor }
            - { name: urban_design, label: Urbanismus }
      - { name: design_in_progress, label: Probíhá projektování, type: boolean, default: false, description: 'Projektování celého projektu právě probíhá, nezávisle na mém zapojení a stavu realizace.' }
      - name: realization
        label: Realizace
        description: 'Stav celého projektu. Nevyplněné pole znamená pouze neuvedený stav.'
        type: select
        required: false
        options:
          placeholder: Stav neuveden
          values:
            - { name: planned, label: Plánovaná realizace }
            - { name: construction, label: Ve výstavbě }
            - { name: built, label: Realizováno }
      - { name: project_url, label: Odkaz na projekt, type: string, required: false, pattern: { regex: '^https?://(?:[\w-]+\.)*[A-Za-z][\w-]*(?:[/?#]\S*)?$|^$', message: 'Zadejte úplnou adresu začínající http:// nebo https://, s doménou bez diakritiky a bez čísla portu (např. :8080), např. https://www.example.cz/projekt.' }, description: 'Úplná adresa externí stránky projektu začínající http:// nebo https://, společná pro oba jazyky. Nepovinné.' }
      - { name: studio, label: Ateliér, type: string, required: false, description: 'Pouze název ateliéru, např. „Fránek Architects“. Jména ostatních lidí patří do spolupráce.' }
      - name: role
        label: Moje role
        type: object
        required: false
        description: 'Stručný přehled mé práce, např. „Návrh interiéru, dokumentace“. Stejný formát jako role ostatních spolupracovníků; souvislosti patří do briefu. Nepovinné: vyplňte oba jazyky, nebo nechte obě pole prázdná.'
        fields: &string-pair
          - { name: cs, label: Česky, type: string, required: true, pattern: *text }
          - { name: en, label: Anglicky, type: string, required: true, pattern: *text }
      - name: collaborators
        label: Spolupráce
        type: object
        list: true
        required: false
        description: 'Ostatní lidé, kteří na projektu spolupracovali, jedna osoba na položku. Mou práci popisuje brief a nepovinné pole Moje role. Uveďte známou roli v obou jazycích; neznámou nechte prázdnou.'
        fields:
          - { name: name, label: Jméno, type: string, required: true, description: 'Společné pro oba jazyky, např. „Ing. Jiří Železný“.' }
          - name: role
            label: Role
            type: object
            required: false
            description: *translations
            fields:
              - { name: cs, label: Česky, type: string, required: true, pattern: *text, description: 'Např. „Autor návrhu“ nebo „vizualizace“.' }
              - { name: en, label: Anglicky, type: string, required: true, pattern: *text, description: 'Např. „Design author“ nebo „Visualizations“.' }
      - name: award
        label: Ocenění
        type: object
        required: false
        description: 'Např. „Odměna za dílčí podnět“. Nepovinné: vyplňte oba jazyky, nebo nechte obě pole prázdná.'
        fields: *string-pair
      - { name: draft, label: Koncept (nezveřejňovat), type: boolean, default: false }
      - name: blocks
        label: Obsah stránky
        type: block
        list: true
        required: false
        blockKey: type
        blocks:
          - name: text
            label: Text
            fields:
              - name: body
                label: Text
                type: object
                required: true
                fields: &rich-text-pair
                  - { name: cs, label: Česky, type: rich-text, required: true, pattern: *text }
                  - { name: en, label: Anglicky, type: rich-text, required: true, pattern: *text }
          - name: gallery
            label: Galerie náhledů
            fields:
              - name: images
                label: Obrázky
                type: object
                list: { min: 1 }
                required: true
                fields:
                  - { name: image, label: Obrázek, type: image, required: true }
                  - { name: comparison_set, label: Srovnávací sada, type: string, required: false, description: "Obrázky se stejnou hodnotou tvoří v prohlížeči obrázků jednu sadu a přepínají se tlačítky." }
                  - { name: title, label: Název obrázku, type: object, required: false, description: *translations, fields: *string-pair }
                  - { name: description, label: Popis obrázku, type: object, required: false, description: *translations, fields: *text-pair }
          - name: image_set
            label: Obrázek nebo prezentace na celou šířku
            fields:
              - name: images
                label: Obrázky
                description: 'Jeden obrázek se zobrazí samostatně na celou šířku. Více obrázků vytvoří prezentaci, kterou návštěvník přepíná šipkami nebo tečkami.'
                type: object
                list: { min: 1 }
                required: true
                fields:
                  - { name: image, label: Obrázek, type: image, required: true }
                  - { name: comparison_set, label: Srovnávací sada, type: string, required: false, description: "Obrázky se stejnou hodnotou tvoří v prohlížeči obrázků jednu sadu a přepínají se tlačítky." }
                  - { name: title, label: Název obrázku, type: object, required: false, description: *translations, fields: *string-pair }
                  - { name: description, label: Popis obrázku, type: object, required: false, description: *translations, fields: *text-pair }

  - name: landing
    label: Úvodní stránka
    type: file
    path: src/content/singletons/landing.md
    fields:
      - { name: images, label: Obrázky, type: image, list: true, required: false, description: 'Zobrazují se nahoře na úvodní stránce v tomto pořadí: jeden obrázek samostatně, dva a více jako prezentace. Když pole necháte prázdné, stránka začne řádkem o tom, co děláte a kde.' }
      - name: projects
        label: Vybrané práce
        type: reference
        list: true
        required: false
        options: { collection: projects, label: '{primary}', search: primary }
        description: 'Projekty v sekci Vybrané práce na úvodní stránce, v tomto pořadí. Koncepty a projekty bez obrázku nebo bez obsahu se nezobrazí. Když pole necháte prázdné, sekce se nezobrazí.'

  - name: about
    label: O mně
    type: file
    path: src/content/singletons/about.md
    fields:
      - { name: portrait, label: Portrét, type: image, required: false }
      - name: approaches
        label: Přístup
        type: object
        list: true
        fields:
          - { name: label, label: Nadpis, type: object, required: true, fields: *string-pair }
          - { name: text, label: Text, type: object, required: true, fields: *text-pair }
          - name: icon
            label: Ikona
            type: select
            required: true
            options:
              placeholder: Vyberte ikonu
              values:
                - { name: place, label: Místo (špendlík) }
                - { name: scale, label: Měřítko (pravítko) }
                - { name: material, label: Materiál (vrstvy) }
                - { name: thinking, label: Myšlení (žárovka) }
      - { name: bio, label: Text o mně, type: object, required: true, fields: *rich-text-pair }
      - name: experience
        label: Praxe
        type: object
        list: true
        description: 'Jedna položka na ateliér nebo zaměstnavatele, nejnovější nahoře.'
        fields:
          - name: place
            label: Ateliér nebo zaměstnavatel
            type: object
            required: true
            fields:
              - { name: cs, label: Česky, type: string, required: true, pattern: *text, description: 'Název a město, např. „Ateliér A, Brno“.' }
              - { name: en, label: Anglicky, type: string, required: true, pattern: *text, description: 'Název a město, např. „Studio A, Brno“.' }
          - { name: department, label: Oddělení nebo tým, type: object, required: false, description: *translations, fields: *string-pair }
          - { name: from, label: Od, type: string, required: false, pattern: *date, description: 'Začátek, společný pro oba jazyky: rok, např. 2023, nebo měsíc a rok, např. 3/2023. U položky bez období nechte „Od“ i „Do“ prázdné.' }
          - { name: to, label: Do, type: string, required: false, pattern: *date, description: 'Konec ve stejném tvaru; u jednoho roku stejný rok jako v poli „Od“. Pokud položka stále trvá, nechte pole prázdné: zobrazí se např. „2023–dosud“.' }
          - name: title
            label: Pozice
            type: object
            required: true
            fields:
              - { name: cs, label: Česky, type: string, required: true, pattern: *text, description: 'Např. „Architektka“.' }
              - { name: en, label: Anglicky, type: string, required: true, pattern: *text, description: 'Např. „Architect“.' }
          - { name: description, label: Popis, type: object, required: false, description: *translations, fields: *text-pair }
      - name: services
        label: Služby
        type: object
        list: true
        description: Jedna služba na položku, pojmenovaná tak, jak by ji hledal klient. Služby se zobrazují na stránce O mně a pod obrázky na úvodní stránce.
        fields:
          - { name: name, label: Služba, type: object, required: true, fields: *string-pair }
      - name: education
        label: Vzdělání
        type: object
        list: true
        description: 'Jedna položka na studijní program, nejnovější nahoře.'
        fields:
          - name: place
            label: Škola
            type: object
            required: true
            fields:
              - { name: cs, label: Česky, type: string, required: true, pattern: *text, description: 'Např. „VUT v Brně“.' }
              - { name: en, label: Anglicky, type: string, required: true, pattern: *text, description: 'Např. „Brno University of Technology“.' }
          - name: department
            label: Fakulta nebo ústav
            type: object
            required: false
            description: *translations
            fields:
              - { name: cs, label: Česky, type: string, required: true, pattern: *text, description: 'Např. „Fakulta stavební, Ústav architektury“.' }
              - { name: en, label: Anglicky, type: string, required: true, pattern: *text, description: 'Např. „Faculty of Civil Engineering, Institute of Architecture“.' }
          - { name: from, label: Od, type: string, required: false, pattern: *date, description: 'Začátek, společný pro oba jazyky: rok, např. 2023, nebo měsíc a rok, např. 3/2023. U položky bez období nechte „Od“ i „Do“ prázdné.' }
          - { name: to, label: Do, type: string, required: false, pattern: *date, description: 'Konec ve stejném tvaru; u jednoho roku stejný rok jako v poli „Od“. Pokud položka stále trvá, nechte pole prázdné: zobrazí se např. „2023–dosud“.' }
          - name: title
            label: Studijní program
            type: object
            required: true
            fields:
              - { name: cs, label: Česky, type: string, required: true, pattern: *text, description: 'Např. „Architektura a rozvoj sídel“.' }
              - { name: en, label: Anglicky, type: string, required: true, pattern: *text, description: 'Např. „Architecture and Urban Development“.' }
          - { name: description, label: Popis, type: object, required: false, description: *translations, fields: *text-pair }
      - name: awards
        label: Ocenění
        type: object
        list: true
        description: 'Jedna položka na soutěž nebo ocenění, nejnovější nahoře.'
        fields:
          - name: place
            label: Soutěž nebo ocenění
            type: object
            required: true
            fields:
              - { name: cs, label: Česky, type: string, required: true, pattern: *text, description: 'Např. „Cena Bohuslava Fuchse“.' }
              - { name: en, label: Anglicky, type: string, required: true, pattern: *text, description: 'Např. „Bohuslav Fuchs Award“.' }
          - { name: department, label: Kategorie nebo pořadatel, type: object, required: false, description: *translations, fields: *string-pair }
          - { name: from, label: Od, type: string, required: false, pattern: *date, description: 'Začátek, společný pro oba jazyky: rok, např. 2023, nebo měsíc a rok, např. 3/2023. U položky bez období nechte „Od“ i „Do“ prázdné.' }
          - { name: to, label: Do, type: string, required: false, pattern: *date, description: 'Konec ve stejném tvaru; u jednoho roku stejný rok jako v poli „Od“. Pokud položka stále trvá, nechte pole prázdné: zobrazí se např. „2023–dosud“.' }
          - name: title
            label: Umístění
            type: object
            required: true
            fields:
              - { name: cs, label: Česky, type: string, required: true, pattern: *text, description: 'Např. „2. místo“.' }
              - { name: en, label: Anglicky, type: string, required: true, pattern: *text, description: 'Např. „2nd place“.' }
          - { name: description, label: Popis, type: object, required: false, description: *translations, fields: *text-pair }

  - name: contact
    label: Kontakt (patička)
    type: file
    path: src/content/singletons/contact.md
    fields:
      - { name: email, label: E-mail, type: string, required: true }
      - { name: phone, label: Telefon, type: string, required: false }
      - name: location
        label: Místo
        type: object
        required: false
        description: 'Uveďte vaše město, např. „Brno“. Zobrazuje se pod obrázky na úvodní stránce. Nepovinné: vyplňte oba jazyky, nebo nechte obě pole prázdná.'
        fields: *string-pair
      - name: hours
        label: Čas pro telefonické hovory
        type: object
        required: false
        description: *translations
        fields:
          - { name: cs, label: Česky, type: string, required: true, pattern: *text, description: 'Kdy přijímáte hovory, např. „Po–Pá 10–15“.' }
          - { name: en, label: Anglicky, type: string, required: true, pattern: *text, description: 'Kdy přijímáte hovory, např. „Mon–Fri 10–15“.' }

  - name: site
    label: Nastavení webu
    type: file
    path: src/content/singletons/site.md
    fields:
      - { name: name, label: Jméno, type: string, required: true }
      - { name: credential, label: Titul (např. Ing. arch.), type: string }
      - name: description
        label: Popis pro vyhledávače
        type: object
        required: true
        description: 'Text, který vyhledávače a náhledy odkazů ukážou u stránek bez vlastního popisu. Jedna nebo dvě věty.'
        fields: *text-pair
