# Pages CMS config — https://pagescms.org
#
# Setup: go to https://app.pagescms.org, sign in with GitHub, and grant the
# Pages CMS GitHub App access to this repo. That's it — no server or OAuth proxy
# to run. The architect edits content in the browser; saving commits to `master`,
# which triggers the GitHub Pages deploy.
#
# The site is bilingual (Czech + English). Fields that differ per language come
# in pairs suffixed _cs / _en; language-neutral fields (images, dates, email,
# phone) are single. See FEATURES.md "Dual language (Czech + English)".
# The build requires both translations whenever either field is filled.

media:
  input: public/uploads # uploaded files are committed here
  output: /uploads # ...and referenced by this path (served from site root)

content:
  - name: projects
    label: Projekty
    type: collection
    path: src/content/projects
    filename:
      template: '{primary}.md'
      field: true
    view:
      primary: title_en
      fields: [title_en, from, to, location_en]
    fields:
      - { name: title_cs, label: Název (česky), type: string, required: true }
      - { name: title_en, label: Název (anglicky), type: string, required: true }
      - name: from
        label: Moje zapojení od
        type: string
        required: true
        pattern: &date { regex: '^((0?[1-9]|1[0-2])/)?[0-9]{4}$|^$', message: 'Zadejte rok, např. 2023, nebo měsíc a rok, např. 3/2023.' }
        description: 'Začátek mé práce na projektu: rok, např. 2023, nebo měsíc a rok, např. 3/2023.'
      - { name: to, label: Moje zapojení do, type: string, required: false, pattern: *date, description: 'Konec mé práce na projektu; u jednoho roku stejný rok jako začátek. Pokud moje zapojení trvá, nechte prázdné. Nejde o datum dokončení stavby.' }
      - { name: location_cs, label: Místo (česky), type: string, required: false }
      - { name: location_en, label: Místo (anglicky), type: string, required: false, description: &translations 'Vyplňte oba jazyky, nebo nechte obě pole prázdná. Chybějící překlad zabrání zveřejnění změn.' }
      - { name: brief_cs, label: Moje práce (česky), type: text, required: false, description: 'Co jsem osobně navrhla, zpracovala nebo koordinovala. Popis celého projektu patří do obsahu stránky.' }
      - { name: brief_en, label: Moje práce (anglicky), type: text, required: false, description: *translations }
      - name: context
        label: Kontext projektu
        description: 'Původ celého projektu. Lze kombinovat, např. školní soutěž. Zakázkový projekt může být zakázkou ateliéru, nemusí jít o mého přímého klienta.'
        type: select
        required: false
        options:
          multiple: true
          values:
            - { name: academic, label: Školní projekt }
            - { name: competition, label: Soutěžní návrh }
            - { name: commissioned, label: Zakázkový projekt }
            - { name: self_initiated, label: Vlastní iniciativa }
      - name: intervention
        label: Zásah
        type: select
        required: false
        options:
          multiple: true
          values:
            - { name: new_build, label: Novostavba }
            - { name: renovation, label: Rekonstrukce }
            - { name: extension, label: Přístavba }
            - { name: adaptive_reuse, label: Změna využití }
      - name: scope
        label: Zaměření projektu
        type: select
        required: false
        options:
          multiple: true
          values:
            - { name: architecture, label: Architektura }
            - { name: interior, label: Interiér }
            - { name: landscape, label: Krajinářská architektura }
            - { name: public_space, label: Veřejný prostor }
            - { name: urban_design, label: Urbanismus }
      - { name: design_in_progress, label: Probíhá projektování, type: boolean, default: false, description: 'Projektování celého projektu právě probíhá, nezávisle na mém zapojení a stavu realizace.' }
      - name: realization
        label: Realizace
        description: 'Stav celého projektu. Nevyplněné pole znamená pouze neuvedený stav.'
        type: select
        required: false
        options:
          placeholder: Stav neuveden
          values:
            - { name: planned, label: Plánovaná realizace }
            - { name: construction, label: Ve výstavbě }
            - { name: built, label: Realizováno }
      - { name: studio, label: Ateliér, type: string, required: false, description: 'Pouze název ateliéru, např. „Fránek Architects“. Jména osob patří do týmu projektu.' }
      - name: team
        label: Tým projektu
        type: object
        list: true
        required: false
        description: 'Všichni členové týmu včetně Terezy Kalábkové, jedna osoba na položku. Uveďte známou roli v obou jazycích; neznámou nechte prázdnou.'
        fields:
          - { name: name, label: Jméno, type: string, required: true, description: 'Společné pro oba jazyky, např. „Ing. Jiří Železný“.' }
          - { name: author, label: Autor/ka architektonického návrhu, type: boolean, required: false, description: 'Označte potvrzené autory architektonického návrhu. Autorství se zobrazuje u jména a používá se také v metadatech projektu.' }
          - { name: role_cs, label: Role (česky), type: string, required: false, description: 'Např. „vizualizace“.' }
          - { name: role_en, label: Role (anglicky), type: string, required: false, description: 'Např. „Visualizations“. Vyplňte oba jazyky, nebo nechte obě pole prázdná. Chybějící překlad zabrání zveřejnění změn.' }
      - { name: award_cs, label: Ocenění (česky), type: string, required: false, description: 'Např. „Odměna za dílčí podnět“.' }
      - { name: award_en, label: Ocenění (anglicky), type: string, required: false, description: *translations }
      - { name: draft, label: Koncept (nezveřejňovat), type: boolean, default: false }
      - name: blocks
        label: Obsah stránky
        type: block
        list: true
        required: false
        blockKey: type
        blocks:
          - name: text
            label: Text
            fields:
              - { name: body_cs, label: Text (česky), type: rich-text, required: true }
              - { name: body_en, label: Text (anglicky), type: rich-text, required: true }
          - name: gallery
            label: Galerie náhledů
            fields:
              - name: images
                label: Obrázky
                type: object
                list: { min: 1 }
                required: true
                fields:
                  - { name: image, label: Obrázek, type: image, required: true }
                  - { name: comparison_set, label: Srovnávací sada, type: string, required: false, description: "Obrázky se stejnou hodnotou tvoří v prohlížeči obrázků jednu sadu a přepínají se tlačítky." }
                  - { name: title_cs, label: Název obrázku (česky), type: string, required: false }
                  - { name: title_en, label: Název obrázku (anglicky), type: string, required: false, description: *translations }
                  - { name: description_cs, label: Popis obrázku (česky), type: text, required: false }
                  - { name: description_en, label: Popis obrázku (anglicky), type: text, required: false, description: *translations }
          - name: image_set
            label: Sada obrázků na celou šířku
            fields:
              - name: images
                label: Obrázky
                type: object
                list: { min: 1 }
                required: true
                fields:
                  - { name: image, label: Obrázek, type: image, required: true }
                  - { name: comparison_set, label: Srovnávací sada, type: string, required: false, description: "Obrázky se stejnou hodnotou tvoří v prohlížeči obrázků jednu sadu a přepínají se tlačítky." }
                  - { name: title_cs, label: Název obrázku (česky), type: string, required: false }
                  - { name: title_en, label: Název obrázku (anglicky), type: string, required: false, description: *translations }
                  - { name: description_cs, label: Popis obrázku (česky), type: text, required: false }
                  - { name: description_en, label: Popis obrázku (anglicky), type: text, required: false, description: *translations }

  - name: landing
    label: Úvodní stránka
    type: file
    path: src/content/singletons/landing.md
    fields:
      - { name: images, label: Obrázky, type: image, list: true, required: false, description: 'Zobrazují se nahoře na úvodní stránce v tomto pořadí: jeden obrázek samostatně, dva a více jako prezentace. Když pole necháte prázdné, stránka začne řádkem o tom, co děláte a kde.' }

  - name: about
    label: O mně
    type: file
    path: src/content/singletons/about.md
    fields:
      - { name: portrait, label: Portrét, type: image, required: false }
      - name: approaches
        label: Přístup
        type: object
        list: true
        fields:
          - { name: label_cs, label: Nadpis (česky), type: string, required: true }
          - { name: label_en, label: Nadpis (anglicky), type: string, required: true }
          - { name: text_cs, label: Text (česky), type: text, required: true }
          - { name: text_en, label: Text (anglicky), type: text, required: true }
          - name: icon
            label: Ikona
            type: select
            required: true
            options:
              placeholder: Vyberte ikonu
              values:
                - { name: place, label: Místo (špendlík) }
                - { name: scale, label: Měřítko (pravítko) }
                - { name: material, label: Materiál (vrstvy) }
                - { name: thinking, label: Myšlení (žárovka) }
      - { name: body_cs, label: Text o mně (česky), type: rich-text, required: true }
      - { name: body_en, label: Text o mně (anglicky), type: rich-text, required: true }
      - name: experience
        label: Praxe
        type: object
        list: true
        description: 'Jedna položka na ateliér nebo zaměstnavatele, nejnovější nahoře.'
        fields:
          - { name: place_cs, label: Ateliér nebo zaměstnavatel (česky), type: string, required: true, description: 'Název a město, např. „Ateliér A, Brno“.' }
          - { name: place_en, label: Ateliér nebo zaměstnavatel (anglicky), type: string, required: true, description: 'Název a město, např. „Studio A, Brno“.' }
          - { name: department_cs, label: Oddělení nebo tým (česky), type: string, required: false }
          - { name: department_en, label: Oddělení nebo tým (anglicky), type: string, required: false, description: *translations }
          - { name: from, label: Od, type: string, required: false, pattern: *date, description: 'Začátek, společný pro oba jazyky: rok, např. 2023, nebo měsíc a rok, např. 3/2023. U položky bez období nechte „Od“ i „Do“ prázdné.' }
          - { name: to, label: Do, type: string, required: false, pattern: *date, description: 'Konec ve stejném tvaru; u jednoho roku stejný rok jako v poli „Od“. Pokud položka stále trvá, nechte pole prázdné: zobrazí se např. „2023–dosud“.' }
          - { name: title_cs, label: Pozice (česky), type: string, required: true, description: 'Např. „Architektka“.' }
          - { name: title_en, label: Pozice (anglicky), type: string, required: true, description: 'Např. „Architect“.' }
          - { name: description_cs, label: Popis (česky), type: text, required: false }
          - { name: description_en, label: Popis (anglicky), type: text, required: false, description: *translations }
      - name: services
        label: Služby
        type: object
        list: true
        description: Jedna služba na položku, pojmenovaná tak, jak by ji hledal klient. Služby se zobrazují na stránce O mně a pod obrázky na úvodní stránce.
        fields:
          - { name: name_cs, label: Služba (česky), type: string, required: true }
          - { name: name_en, label: Služba (anglicky), type: string, required: true }
      - name: education
        label: Vzdělání
        type: object
        list: true
        description: 'Jedna položka na studijní program, nejnovější nahoře.'
        fields:
          - { name: place_cs, label: Škola (česky), type: string, required: true, description: 'Např. „VUT v Brně“.' }
          - { name: place_en, label: Škola (anglicky), type: string, required: true, description: 'Např. „Brno University of Technology“.' }
          - { name: department_cs, label: Fakulta nebo ústav (česky), type: string, required: false, description: 'Např. „Fakulta stavební, Ústav architektury“.' }
          - { name: department_en, label: Fakulta nebo ústav (anglicky), type: string, required: false, description: 'Např. „Faculty of Civil Engineering, Institute of Architecture“. Vyplňte oba jazyky, nebo nechte obě pole prázdná. Chybějící překlad zabrání zveřejnění změn.' }
          - { name: from, label: Od, type: string, required: false, pattern: *date, description: 'Začátek, společný pro oba jazyky: rok, např. 2023, nebo měsíc a rok, např. 3/2023. U položky bez období nechte „Od“ i „Do“ prázdné.' }
          - { name: to, label: Do, type: string, required: false, pattern: *date, description: 'Konec ve stejném tvaru; u jednoho roku stejný rok jako v poli „Od“. Pokud položka stále trvá, nechte pole prázdné: zobrazí se např. „2023–dosud“.' }
          - { name: title_cs, label: Studijní program (česky), type: string, required: true, description: 'Např. „Architektura a rozvoj sídel“.' }
          - { name: title_en, label: Studijní program (anglicky), type: string, required: true, description: 'Např. „Architecture and Urban Development“.' }
          - { name: description_cs, label: Popis (česky), type: text, required: false }
          - { name: description_en, label: Popis (anglicky), type: text, required: false, description: *translations }
      - name: awards
        label: Ocenění
        type: object
        list: true
        description: 'Jedna položka na soutěž nebo ocenění, nejnovější nahoře.'
        fields:
          - { name: place_cs, label: Soutěž nebo ocenění (česky), type: string, required: true, description: 'Např. „Cena Bohuslava Fuchse“.' }
          - { name: place_en, label: Soutěž nebo ocenění (anglicky), type: string, required: true, description: 'Např. „Bohuslav Fuchs Award“.' }
          - { name: department_cs, label: Kategorie nebo pořadatel (česky), type: string, required: false }
          - { name: department_en, label: Kategorie nebo pořadatel (anglicky), type: string, required: false, description: *translations }
          - { name: from, label: Od, type: string, required: false, pattern: *date, description: 'Začátek, společný pro oba jazyky: rok, např. 2023, nebo měsíc a rok, např. 3/2023. U položky bez období nechte „Od“ i „Do“ prázdné.' }
          - { name: to, label: Do, type: string, required: false, pattern: *date, description: 'Konec ve stejném tvaru; u jednoho roku stejný rok jako v poli „Od“. Pokud položka stále trvá, nechte pole prázdné: zobrazí se např. „2023–dosud“.' }
          - { name: title_cs, label: Umístění (česky), type: string, required: true, description: 'Např. „2. místo“.' }
          - { name: title_en, label: Umístění (anglicky), type: string, required: true, description: 'Např. „2nd place“.' }
          - { name: description_cs, label: Popis (česky), type: text, required: false }
          - { name: description_en, label: Popis (anglicky), type: text, required: false, description: *translations }

  - name: contact
    label: Kontakt (patička)
    type: file
    path: src/content/singletons/contact.md
    fields:
      - { name: email, label: E-mail, type: string, required: true }
      - { name: phone, label: Telefon, type: string, required: false }
      - { name: location_cs, label: Místo (česky), type: string, required: false, description: 'Uveďte vaše město, např. „Brno“. Zobrazuje se pod obrázky na úvodní stránce.' }
      - { name: location_en, label: Místo (anglicky), type: string, required: false, description: *translations }
      - { name: hours_cs, label: Čas pro telefonické hovory (česky), type: string, required: false, description: 'Kdy přijímáte hovory, např. „Po–Pá 10–15“.' }
      - { name: hours_en, label: Čas pro telefonické hovory (anglicky), type: string, required: false, description: 'Kdy přijímáte hovory, např. „Mon–Fri 10–15“. Vyplňte oba jazyky, nebo nechte obě pole prázdná. Chybějící překlad zabrání zveřejnění změn.' }

  - name: site
    label: Nastavení webu
    type: file
    path: src/content/singletons/site.md
    fields:
      - { name: name, label: Jméno, type: string, required: true }
      - { name: credential, label: Titul (např. Ing. arch.), type: string }
      - { name: description_cs, label: Popis pro vyhledávače (česky), type: text, required: true, description: 'Text, který vyhledávače a náhledy odkazů ukážou u stránek bez vlastního popisu. Jedna nebo dvě věty.' }
      - { name: description_en, label: Popis pro vyhledávače (anglicky), type: text, required: true, description: 'Text, který vyhledávače a náhledy odkazů ukážou u stránek bez vlastního popisu. Jedna nebo dvě věty.' }
