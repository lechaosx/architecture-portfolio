# Pages CMS config — https://pagescms.org
#
# Setup: go to https://app.pagescms.org, sign in with GitHub, and grant the
# Pages CMS GitHub App access to this repo. That's it — no server or OAuth proxy
# to run. The architect edits content in the browser; saving commits to `master`,
# which triggers the GitHub Pages deploy.
#
# The site is bilingual (Czech + English). Fields that differ per language come
# in pairs suffixed _cs / _en; language-neutral fields (images, year, email,
# phone) are single. See FEATURES.md "Dual language (Czech + English)".

media:
  input: public/uploads # uploaded files are committed here
  output: /uploads # ...and referenced by this path (served from site root)

content:
  - name: projects
    label: Projects
    type: collection
    path: src/content/projects
    filename:
      template: '{primary}.md'
      field: true
    view:
      primary: title_en
      fields: [title_en, year, location_en]
    fields:
      - { name: title_cs, label: Title (Czech), type: string, required: true }
      - { name: title_en, label: Title (English), type: string, required: true }
      - { name: year, label: Year, type: number, required: true }
      - { name: location_cs, label: Location (Czech), type: string, required: false }
      - { name: location_en, label: Location (English), type: string, required: false }
      - { name: brief_cs, label: Brief (Czech), type: text, required: false }
      - { name: brief_en, label: Brief (English), type: text, required: false }
      - { name: draft, label: Draft (hide from site), type: boolean, default: false }
      - name: blocks
        label: Page content
        type: block
        list: true
        required: false
        blockKey: type
        blocks:
          - name: text
            label: Text
            fields:
              - { name: body_cs, label: Text (Czech), type: rich-text, required: true }
              - { name: body_en, label: Text (English), type: rich-text, required: true }
          - name: gallery
            label: Thumbnail gallery
            fields:
              - name: images
                label: Images
                type: object
                list: { min: 1 }
                required: true
                fields:
                  - { name: image, label: Image, type: image, required: true }
                  - { name: comparison_set, label: Comparison set, type: string, required: false, description: "Images with the same value share a set strip of buttons in the lightbox." }
                  - { name: title_cs, label: Image name/title (Czech), type: string, required: false }
                  - { name: title_en, label: Image name/title (English), type: string, required: false }
                  - { name: description_cs, label: Image description (Czech), type: text, required: false }
                  - { name: description_en, label: Image description (English), type: text, required: false }
          - name: image_set
            label: Full-width image set
            fields:
              - name: images
                label: Images
                type: object
                list: { min: 1 }
                required: true
                fields:
                  - { name: image, label: Image, type: image, required: true }
                  - { name: comparison_set, label: Comparison set, type: string, required: false, description: "Images with the same value share a set strip of buttons in the lightbox." }
                  - { name: title_cs, label: Image name/title (Czech), type: string, required: false }
                  - { name: title_en, label: Image name/title (English), type: string, required: false }
                  - { name: description_cs, label: Image description (Czech), type: text, required: false }
                  - { name: description_en, label: Image description (English), type: text, required: false }

  - name: home
    label: Home page
    type: file
    path: src/content/singletons/home.md
    fields:
      - { name: portrait, label: Portrait, type: image, required: false }
      - name: gallery
        label: Homepage images
        type: image
        list: { min: 1 }
        required: true
      - name: approaches
        label: Approach
        type: object
        list: true
        fields:
          - { name: label_cs, label: Label (Czech), type: string, required: true }
          - { name: label_en, label: Label (English), type: string, required: true }
          - { name: text_cs, label: Text (Czech), type: text, required: true }
          - { name: text_en, label: Text (English), type: text, required: true }
          - name: icon
            label: Icon
            type: select
            required: true
            options:
              values: [place, scale, material, thinking]
      - { name: body_cs, label: About text (Czech), type: rich-text, required: true }
      - { name: body_en, label: About text (English), type: rich-text, required: true }
      - name: services
        label: Services
        type: object
        list: true
        description: One service per row, named the way a client would ask for it.
        fields:
          - { name: name_cs, label: Service (Czech), type: string, required: true }
          - { name: name_en, label: Service (English), type: string, required: true }
      - { name: area_cs, label: Where I work (Czech), type: string, required: false, description: 'Your base city first, then where you take on projects, e.g. "Brno, projekty v Česku i v zahraničí".' }
      - { name: area_en, label: Where I work (English), type: string, required: false, description: 'Your base city first, then where you take on projects, e.g. "Brno, projects in the Czech Republic and abroad".' }
      - name: education
        label: Education
        type: object
        list: true
        description: School, faculty, degree and year.
        fields:
          - { name: text_cs, label: Text (Czech), type: string, required: true }
          - { name: text_en, label: Text (English), type: string, required: true }
      - name: awards
        label: Awards
        type: object
        list: true
        description: Competition or award, the placement, the year.
        fields:
          - { name: text_cs, label: Text (Czech), type: string, required: true }
          - { name: text_en, label: Text (English), type: string, required: true }

  - name: contact
    label: Contact
    type: file
    path: src/content/singletons/contact.md
    fields:
      - { name: email, label: Email, type: string, required: true }
      - { name: phone, label: Phone, type: string, required: false }
      - name: hours
        label: When I'm reachable (per day)
        type: object
        list: true
        fields:
          - { name: day_cs, label: Day (Czech), type: string, required: true }
          - { name: day_en, label: Day (English), type: string, required: true }
          - { name: hours, label: Hours (e.g. 10:00 – 15:00, or —), type: string, required: true }

  - name: site
    label: Site settings
    type: file
    path: src/content/singletons/site.md
    fields:
      - { name: name, label: Name, type: string, required: true }
      - { name: credential, label: Credential (e.g. Ing. arch.), type: string }
      - { name: description_cs, label: SEO description (Czech), type: text }
      - { name: description_en, label: SEO description (English), type: text }
