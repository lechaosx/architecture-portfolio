name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Check whether tests are needed
        if: github.event_name == 'push'
        id: changes
        uses: dorny/paths-filter@v4
        with:
          predicate-quantifier: some-with-excludes
          filters: |
            code:
              - '**'
              - '!src/content/**'
              - '!public/uploads/**'
      - name: Set up Node
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.code == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.code == 'true'
        run: npm ci
      - name: Cache Astro build assets
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.code == 'true'
        uses: actions/cache@v6
        with:
          path: ./node_modules/.astro
          key: astro-cache-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            astro-cache-${{ runner.os }}-
      - name: Run static analysis
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.code == 'true'
        run: npm run check
      - name: Run unit tests
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.code == 'true'
        run: npm run test
      - name: Install browsers
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.code == 'true'
        run: npx playwright install --with-deps chromium firefox
      - name: Run browser tests
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.code == 'true'
        run: npm run test:e2e

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      # The site is root-only on a custom domain (public/CNAME); site/SEO is set
      # in astro.config.mjs. Nothing to configure here.
      - name: Build with Astro
        uses: withastro/action@v6

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
